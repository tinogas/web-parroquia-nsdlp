<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 800" preserveAspectRatio="xMidYMid slice">
  <!-- Ilustración provisional: sustituir por una foto real del templo. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233a"/>
      <stop offset="0.38" stop-color="#1e4d8b"/>
      <stop offset="0.68" stop-color="#c77d4a"/>
      <stop offset="0.86" stop-color="#e7b75a"/>
      <stop offset="1" stop-color="#f3d68a"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="0.45" stop-color="#f6d27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e7b75a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cerroLejano" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4f5c"/>
      <stop offset="1" stop-color="#5a3c55"/>
    </linearGradient>
    <linearGradient id="cerro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2e4a"/>
      <stop offset="1" stop-color="#28233c"/>
    </linearGradient>
    <linearGradient id="vitral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d27a"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="800" fill="url(#cielo)"/>

  <!-- estrellas tempranas -->
  <g fill="#fff" opacity="0.7">
    <circle cx="140" cy="70" r="1.6"/><circle cx="310" cy="130" r="1.2"/><circle cx="520" cy="55" r="1.8"/>
    <circle cx="760" cy="110" r="1.1"/><circle cx="980" cy="45" r="1.5"/><circle cx="1210" cy="95" r="1.3"/>
    <circle cx="1420" cy="60" r="1.7"/><circle cx="1650" cy="120" r="1.2"/><circle cx="1730" cy="40" r="1.4"/>
    <circle cx="420" cy="200" r="1"/><circle cx="1320" cy="190" r="1"/>
  </g>

  <!-- sol poniente -->
  <circle cx="1240" cy="560" r="300" fill="url(#sol)"/>
  <circle cx="1240" cy="560" r="78" fill="#fff1c4" opacity="0.95"/>

  <!-- sierras lejanas -->
  <path d="M0 560 L120 520 L230 545 L360 480 L470 520 L600 470 L720 515 L860 485 L1000 530 L1130 495 L1280 540 L1420 490 L1560 525 L1700 480 L1800 505 L1800 800 L0 800 Z" fill="url(#cerroLejano)" opacity="0.85"/>

  <!-- Cerro de la Campana, a la izquierda -->
  <path d="M0 610 L90 590 L180 520 L250 470 L300 455 L350 470 L420 520 L520 585 L640 615 L1800 640 L1800 800 L0 800 Z" fill="url(#cerro)"/>

  <!-- templo en silueta -->
  <g fill="#1a1830">
    <!-- nave -->
    <rect x="900" y="520" width="380" height="140"/>
    <path d="M880 525 L1090 430 L1300 525 Z"/>
    <!-- campanario -->
    <rect x="1290" y="420" width="90" height="240"/>
    <rect x="1280" y="410" width="110" height="18"/>
    <rect x="1300" y="330" width="70" height="85"/>
    <path d="M1295 335 L1335 270 L1375 335 Z"/>
    <rect x="1331" y="215" width="8" height="58"/>
    <rect x="1316" y="232" width="38" height="8"/>
    <!-- cruz del frontón -->
    <rect x="1086" y="378" width="8" height="56"/>
    <rect x="1072" y="394" width="36" height="8"/>
  </g>
  <!-- luz en vanos y vitrales -->
  <g fill="url(#vitral)">
    <path d="M1060 660 L1060 585 Q1090 555 1120 585 L1120 660 Z" opacity="0.95"/>
    <circle cx="1090" cy="488" r="20" opacity="0.9"/>
    <path d="M950 620 L950 575 Q965 560 980 575 L980 620 Z" opacity="0.75"/>
    <path d="M1200 620 L1200 575 Q1215 560 1230 575 L1230 620 Z" opacity="0.75"/>
    <path d="M1320 400 L1320 360 Q1335 345 1350 360 L1350 400 Z" opacity="0.85"/>
  </g>

  <!-- suelo y sahuaros -->
  <path d="M0 660 Q450 640 900 655 T1800 650 L1800 800 L0 800 Z" fill="#141226"/>
  <g fill="#141226">
    <path d="M620 660 L620 520 Q620 500 636 500 Q652 500 652 520 L652 660 Z"/>
    <path d="M620 590 L596 590 Q584 590 584 578 L584 545 Q584 533 596 533 Q606 533 606 545 L606 570 L620 570 Z"/>
    <path d="M652 600 L676 600 Q688 600 688 588 L688 560 Q688 548 676 548 Q666 548 666 560 L666 580 L652 580 Z"/>
    <path d="M1560 660 L1560 560 Q1560 545 1572 545 Q1584 545 1584 560 L1584 660 Z"/>
    <path d="M1584 610 L1600 610 Q1610 610 1610 600 L1610 580 Q1610 570 1600 570 Q1592 570 1592 580 L1592 595 L1584 595 Z"/>
    <path d="M180 665 L180 600 Q180 590 189 590 Q198 590 198 600 L198 665 Z"/>
  </g>
</svg>
